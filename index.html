
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Movie Watchlist</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>My Movie Watchlist</h1>
        <p>Keep track of the movies you want to watch!</p>
    </header>

    <main>
        <form id="movie-form">
            <label for="movie-title">Movie title</label>
            <input
                type="text"
                id="movie-title"
                placeholder="Enter a movie title"
            >

            <label for="movie-genre">Genre</label>
            <select id="movie-genre">
                <option value="">Choose a genre</option>
                <option value="Action">Action</option>
                <option value="Adventure">Adventure</option>
                <option value="Animation">Animation</option>
                <option value="Comedy">Comedy</option>
                <option value="Drama">Drama</option>
                <option value="Fantasy">Fantasy</option>
                <option value="Horror">Horror</option>
                <option value="Romance">Romance</option>
                <option value="Science Fiction">Science Fiction</option>
                <option value="Thriller">Thriller</option>
            </select>

            <button type="submit">Add Movie</button>
        </form>

        <p id="form-message" role="status"></p>

        <section>
            <h2>Movies on my list</h2>
            <p id="empty-message">Your watchlist is empty. Add a movie to get started.</p>
            <ul id="movie-list"></ul>
        </section>
    </main>
</body>
</html>
